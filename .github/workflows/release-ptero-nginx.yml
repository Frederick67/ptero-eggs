name: Build and push nginx-ptero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/release-ptero-nginx.yml
  schedule:
    # weekly rebuild to pick up Alpine/PHP security patches
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: "nginx-ptero:8.4"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nginx-ptero
          tags: |
            type=raw,value=8.4
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
